<mat-toolbar color="primary">
  <button mat-icon-button (click)="toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Angular Demo App</span>
</mat-toolbar>

<mat-sidenav-container style="height: calc(100vh - 64px);">
  <mat-sidenav mode="side" [(opened)]="opened">
    <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="opened=false">Home</a>
      <a mat-list-item routerLink="/forms" (click)="opened=false">Forms Demo</a>
      <a mat-list-item routerLink="/defer" (click)="opened=false">Defer</a>
      <a mat-list-item routerLink="/advanced-defer" (click)="opened=false">Advanced Defer</a>
      <a mat-list-item routerLink="/placeholder" (click)="opened=false">Placeholder</a>
      <a mat-list-item routerLink="/loading" (click)="opened=false">Loading</a>
      <a mat-list-item routerLink="/error" (click)="opened=false">Error</a>
      <a mat-list-item routerLink="/if" (click)="opened=false">If</a>
      <a mat-list-item routerLink="/for" (click)="opened=false">For</a>
      <a mat-list-item routerLink="/switch" (click)="opened=false">Switch</a>
      <a mat-list-item routerLink="/drag-drop" (click)="opened=false">Drag &amp; Drop</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content style="padding: 16px;">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
